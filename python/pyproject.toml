[project]
name = "tiny-claw"
version = "0.1.0"
description = "Python 实现的 tiny-claw（对照 go/ 教程，自行填写）"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "python-dotenv",
]

[project.scripts]
claw = "tiny_claw.claw:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_claw"]
